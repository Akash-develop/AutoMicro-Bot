[tool.poetry]
name = "automicro-bot"
version = "0.1.0"
description = "AutoMicro-Bot — Floating AI Chatbot Backend"
authors = ["AutoMicro <automicro@local>"]
readme = "README.md"
package-mode = false

# Older Poetry versions may ignore `package-mode = false` and still try to
# install the project as a package. Explicitly declare what to package.
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
langchain = "^0.3.0"
langchain-ollama = "^0.2.0"
langgraph = "^0.2.0"
aiosqlite = "^0.20.0"
python-dotenv = "^1.0.0"
pydantic = "^2.9.0"
websockets = "^13.0"
langchain-openai = ">=0.3.0"
langgraph-checkpoint-sqlite = "<2.0.0"
langchain-anthropic = "<1.0.0"
langchain-google-genai = "^2.0.0"
httpx = "^0.27.0"
chromadb = "^1.5.5"
pdfplumber = "^0.11.9"
langchain-text-splitters = ">=0.3.0,<1.0.0"
langchain-chroma = ">=0.2.0,<1.0.0"
python-multipart = "^0.0.22"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Bug #9 fix: scripts must be in [tool.poetry.scripts], not [build-system]
# Now `poetry run start` will start the uvicorn server
[tool.poetry.scripts]
start = "app.main:start"
